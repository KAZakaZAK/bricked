<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Brick">
  <meta name="theme-color" content="#FCF0DA">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="icon" href="icons/icon-192.png">
  <link rel="stylesheet" href="style.css">
  <title>Brick</title>
</head>
<body>
  <main id="app" data-state="unlocked">

    <!-- Panel 1: State Deck -->
    <section class="hero" aria-label="Phone state">
      <div class="eyebrow"><span class="dot"></span><span>PHONE STATE</span></div>
      <div class="headline">
        <h1 id="state" aria-live="polite">UNLOCKED</h1>
        <p id="hint">Tap the tag to brick this phone</p>
      </div>
      <div class="timer">
        <span id="timerLabel" class="eyebrow-text">MIN LOCK</span>
        <strong id="timerValue">--:--:--</strong>
      </div>
    </section>

    <!-- Panel 2: Essential Grid -->
    <section class="essentials" aria-label="Essential apps">
      <h2>ESSENTIALS</h2>
      <nav class="chips">
        <a class="chip" href="tel:">
          <span class="icon"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z"/></svg></span>
          <span>Phone</span>
        </a>
        <a class="chip" href="sms:">
          <span class="icon"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg></span>
          <span>Messages</span>
        </a>
        <a class="chip" href="maps://">
          <span class="icon"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 10c0 6-8 12-8 12s-8-6-8-12a8 8 0 0 1 16 0Z"/><circle cx="12" cy="10" r="3"/></svg></span>
          <span>Maps</span>
        </a>
        <a class="chip" href="music://">
          <span class="icon"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/></svg></span>
          <span>Music</span>
        </a>
      </nav>
    </section>

    <!-- Panel 3: NFC Configuration Drawer -->
    <section class="drawer" aria-label="NFC configuration">
      <div class="handle"></div>
      <h2>NFC CONFIGURATION</h2>
      <dl class="details">
        <div class="row"><dt>PROFILE</dt><dd>Deep Focus</dd></div>
        <div class="row"><dt>TRIGGER</dt><dd>NFC, via Shortcuts</dd></div>
        <div class="row"><dt>TAG TYPE</dt><dd>NTAG215</dd></div>
        <div class="row">
          <dt><label for="minLock">MIN LOCK</label></dt>
          <dd>
            <select id="minLock">
              <option value="0">None</option>
              <option value="30">30 min</option>
              <option value="60">1 hour</option>
              <option value="120">2 hours</option>
              <option value="240">4 hours</option>
              <option value="480">8 hours</option>
            </select>
          </dd>
        </div>
        <div class="row">
          <dt id="fwLabel">FIREWALL</dt>
          <dd><button id="firewall" class="switch" role="switch" aria-checked="true" aria-labelledby="fwLabel"><span class="knob"></span></button></dd>
        </div>
      </dl>

      <button id="cta" class="cta">Arm tag and run BRICK protocol</button>
      <p id="note" class="note" aria-live="polite"></p>
      <button id="emergency" class="link" hidden>Emergency unlock</button>
    </section>

  </main>
  <script src="app.js"></script>
</body>
</html>
